name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check OpenCode plugin syntax
        run: node --check opencode/plugins/ecc-parity.js
      - name: Scan tracked files for common secrets
        run: "! git grep -nE '(ghp_|github_pat_|sk-[A-Za-z0-9]|api[_-]?key|password=)'"
